<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d10;
      color: #e8e8e8;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #252930;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .rook {
      align-self: flex-start;
      background: #1b2027;
    }

    .user {
      align-self: flex-end;
      background: #343b45;
    }

    #input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #252930;
      gap: 8px;
    }

    #message {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1b2027;
      color: white;
      outline: none;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #e8e8e8;
      color: #0b0d10;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>ROOK</header>

  <div id="chat">
    <div class="message rook">
      I'm Rook. My brain isn't connected yet, but we're fixing that.
    </div>
  </div>

  <div id="input-area">
    <input
      id="message"
      type="text"
      placeholder="Talk to Rook..."
      autocomplete="off"
    >
    <button id="send">Send</button>
  </div>

  <script>
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(
          "I received that. My actual brain isn't connected yet.",
          "rook"
        );
      }, 500);
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
